<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fighter Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --paper: #EDEAE3;
        --ink: #15130F;
        --steel: #6B6560;
        --hairline: #C9C3B8;
        --accent: #A32020;
        --card-bg: #E2DDD2;
    }

    html[data-theme="dark"] {
        --paper: #17140F;
        --ink: #EDEAE3;
        --steel: #948C7F;
        --hairline: #3A362E;
        --accent: #D4534A;
        --card-bg: #1E1A13;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background-color: var(--paper);
        color: var(--ink);
        font-family: 'Inter', system-ui, sans-serif;
        transition: background-color 0.25s ease, color 0.25s ease;
    }

    .page {
        max-width: 1080px;
        margin: 0 auto;
        padding: 56px 28px 80px;
    }

    .roster-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 2px solid var(--ink);
        padding-bottom: 18px;
        margin-bottom: 40px;
    }

    .roster-header h1 {
        font-family: 'Oswald', sans-serif;
        font-weight: 600;
        font-size: 2.4rem;
        letter-spacing: 0.5px;
        margin: 0;
        line-height: 1;
    }

    .roster-header p {
        margin: 6px 0 0;
        color: var(--steel);
        font-size: 0.95rem;
    }

    .theme-toggle {
        background: none;
        border: 1px solid var(--ink);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        font-size: 0.85rem;
        padding: 8px 16px;
        cursor: pointer;
        border-radius: 2px;
    }

    .theme-toggle:hover {
        background-color: var(--ink);
        color: var(--paper);
    }

    .roster-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1px;
        background-color: var(--hairline);
        border: 1px solid var(--hairline);
    }

    .fighter-card {
        background-color: var(--card-bg);
        padding: 20px;
    }

    .card-top {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 16px;
    }

    .fighter-photo {
        width: 64px;
        height: 64px;
        object-fit: cover;
        object-position: top center;
        flex-shrink: 0;
        background-color: var(--hairline);
        border: 1px solid var(--hairline);
    }

    .fighter-name {
        font-family: 'Oswald', sans-serif;
        font-weight: 600;
        font-size: 1.3rem;
        line-height: 1.1;
        margin: 0 0 4px;
    }

    .fighter-class {
        color: var(--steel);
        font-size: 0.85rem;
        margin: 0;
    }

    .tale-of-tape {
        border-top: 1px solid var(--hairline);
        padding-top: 12px;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        font-size: 0.9rem;
    }

    .stat-label {
        color: var(--steel);
    }

    .stat-value {
        font-weight: 500;
    }

    .stat-value.record {
        color: var(--accent);
        font-weight: 600;
    }

    @media (max-width: 480px) {
        .page { padding: 36px 16px 60px; }
        .roster-header { flex-direction: column; align-items: flex-start; gap: 14px; }
    }
</style>
</head>
<body>

<div class="page">

    <div class="roster-header">
        <div>
            <h1>Fighter Roster</h1>
            <p>{{ fighters|length }} fighters listed</p>
        </div>
        <button class="theme-toggle" id="themeToggle" type="button">Switch to light</button>
    </div>

    <div class="roster-grid">
        {% for fighter in fighters %}
        <div class="fighter-card">
            <div class="card-top">
                <img class="fighter-photo" src="{{ fighter.img }}" alt="{{ fighter.fighter }}">
                <div>
                    <p class="fighter-name">{{ fighter.fighter }}</p>
                    <p class="fighter-class">{{ fighter.weight_class }}</p>
                </div>
            </div>
            <div class="tale-of-tape">
                <div class="stat-row">
                    <span class="stat-label">Record</span>
                    <span class="stat-value record">{{ fighter.record }}</span>
                </div>
                {% if fighter.stance %}
                <div class="stat-row">
                    <span class="stat-label">Stance</span>
                    <span class="stat-value">{{ fighter.stance }}</span>
                </div>
                {% endif %}
                {% if fighter.wins %}
                <div class="stat-row">
                    <span class="stat-label">Wins</span>
                    <span class="stat-value">{{ fighter.wins }}</span>
                </div>
                {% endif %}
            </div>
        </div>
        {% endfor %}
    </div>

</div>

<script>
    const toggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    const saved = localStorage.getItem('theme');
    if (saved) {
        html.setAttribute('data-theme', saved);
        toggle.textContent = saved === 'dark' ? 'Switch to light' : 'Switch to dark';
    }
    toggle.addEventListener('click', () => {
        const current = html.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        toggle.textContent = next === 'dark' ? 'Switch to light' : 'Switch to dark';
    });
</script>

</body>
</html>
